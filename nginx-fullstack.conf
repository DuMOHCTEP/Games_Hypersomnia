server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Веб-клиент Hypersomnia
    location / {
        try_files $uri $uri/ /index.html;
        
        # CORS заголовки для WebAssembly
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Opener-Policy same-origin;
        
        # Cache настройки для веб-клиента
        location ~* \.(js|wasm|html)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header Cross-Origin-Embedder-Policy require-corp;
            add_header Cross-Origin-Opener-Policy same-origin;
        }
        
        location ~* \.(css|ico|png|jpg|jpeg|gif|svg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Проксирование игрового трафика на локальный сервер
    location /api/game {
        proxy_pass http://127.0.0.1:8412;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Настройки для больших WebAssembly файлов
    client_max_body_size 100M;
    
    # Сжатие для веб-клиента
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Безопасность 
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; object-src 'none'; frame-ancestors 'self';" always;
}
