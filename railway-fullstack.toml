[build]
# Указываем использовать полный Dockerfile с веб-клиентом + сервером
dockerfile = "Dockerfile.fullstack"

[deploy]
# Railway автоматически установит PORT переменную для HTTP
startCommand = "/home/hypersomniac/start-fullstack.sh"
restartPolicyType = "always"

[experimental]
# Включаем поддержку UDP трафика для игровых соединений
incrementalBuilds = false

# Переменные окружения для полной связки веб-клиент + сервер
[environments.production.variables]
# Основные настройки сервера
SERVER_NAME = "[Portal] Hypersomnia Production"
MAX_PLAYERS = "20"
RCON_PASSWORD = "secure_portal_password_2024"

# Настройки карт и режимов
DEFAULT_ARENA = "de_cyberaqua"
SYNC_ARENAS = "true"
DAILY_AUTOUPDATE = "false"

# Количество серверных инстансов
CASUAL_SERVERS = "1"
RANKED_SERVERS = "0"

# Настройки портов (Railway автоматически назначит PORT для HTTP)
WEBRTC_PORT = "9000"

# Дополнительные флаги (опционально)
EXTRA_FLAGS = ""

# Брендинг игрового портала
PORTAL_NAME = "Ваш Игровой Портал"
PORTAL_DOMAIN = "your-railway-domain.railway.app"

[environments.development.variables]
# Настройки для тестирования
SERVER_NAME = "[Portal-Dev] Test Server"
MAX_PLAYERS = "8"
RCON_PASSWORD = "dev_portal_123"
DEFAULT_ARENA = "de_duel_practice"
SYNC_ARENAS = "false"
CASUAL_SERVERS = "1"
RANKED_SERVERS = "0"
PORTAL_NAME = "Dev Portal"
