[build]
# Указываем использовать специальный Dockerfile для Railway
dockerfile = "Dockerfile.railway"

[deploy]
# Railway автоматически установит PORT переменную для HTTP
# Но мы используем UDP порты для игрового трафика
startCommand = "./start-railway.sh"
restartPolicyType = "always"

[experimental]
# Включаем поддержку UDP трафика для игровых соединений  
incrementalBuilds = false

# Переменные окружения для настройки сервера Hypersomnia
[environments.production.variables]
# Основные настройки сервера
SERVER_NAME = "[Railway] Hypersomnia Production Server"
MAX_PLAYERS = "20"
RCON_PASSWORD = "secure_railway_password_2024"

# Настройки карт и режимов
DEFAULT_ARENA = "de_cyberaqua"
SYNC_ARENAS = "true"
DAILY_AUTOUPDATE = "false"

# Количество серверных инстансов
CASUAL_SERVERS = "1"
RANKED_SERVERS = "0"

# Настройки портов (Railway автоматически назначит PORT)
WEBRTC_PORT = "9000"

# Дополнительные флаги (опционально)
EXTRA_FLAGS = "--daily-autoupdate"

[environments.development.variables]
# Настройки для тестирования
SERVER_NAME = "[Railway-Dev] Hypersomnia Test Server"
MAX_PLAYERS = "10"
RCON_PASSWORD = "dev_password_123"
DEFAULT_ARENA = "de_duel_practice"
SYNC_ARENAS = "false"
CASUAL_SERVERS = "1"
RANKED_SERVERS = "0"
